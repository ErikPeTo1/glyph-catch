name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings, e.g. 3.2.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Open ...
        2. Tap ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
